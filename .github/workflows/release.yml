name: Release

on:
  push:
    branches:
      - main
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Configure this repository variable before the first release. It is
      # deliberately not a secret and must match every public package scope.
      NPM_SCOPE: ${{ vars.NPM_SCOPE }}
      NPM_CONFIG_ACCESS: public
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gates
        run: pnpm run verify

      - name: Validate OIDC release configuration
        run: pnpm run release:check

      # Configure this workflow as a Trusted Publisher in npm first. No
      # NPM_TOKEN or NODE_AUTH_TOKEN is intentionally provided here.
      - name: Version or publish Changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release:publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
